<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Resultado - Filtro GOV</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; }
        .header { background: #007bff; color: white; padding: 15px 30px; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; }
        .btn { display: inline-block; margin: 10px 10px 10px 0; padding: 12px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        .btn:hover { background: #0056b3; }
        .info { background: #e7f3ff; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('dashboard') }}">← Menu</a>
    </div>
    <div class="container">
        <h2>Processamento Concluído</h2>
        <div class="info">
            <b>{{ files.q }}</b> contatos gerados<br>
            <b>{{ files.n }}</b> empresas novas salvas no banco<br>
            <b>{{ files.rep }}</b> empresas repetidas ignoradas
        </div>
        <a href="{{ url_for('download', tipo='original') }}" class="btn">Baixar ORIGINAL.txt</a>
        <a href="{{ url_for('download', tipo='filtrado') }}" class="btn">Baixar FILTRADO.txt</a>
        <a href="{{ url_for('download', tipo='vcf') }}" class="btn">Baixar VCF</a>
        <br><br>
        <a href="{{ url_for('download_todos') }}" class="btn" style="background:#6f42c1;">Baixar os 3 juntos (ZIP)</a>
        <br><br>
        <a href="{{ url_for('processar') }}">Processar outro arquivo</a>
    </div>
</body>
</html>
