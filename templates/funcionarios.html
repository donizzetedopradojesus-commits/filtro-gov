<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Funcionários - Filtro GOV</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; }
        .header { background: #007bff; color: white; padding: 15px 30px; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; }
        input { padding: 8px; margin: 5px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .del { background: #dc3545; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .flash { background: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('dashboard') }}">← Voltar</a>
    </div>
    <div class="container">
        <h2>Funcionários</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="post">
            <input type="hidden" name="action" value="adicionar">
            <input type="text" name="nome" placeholder="Nome do funcionário" required>
            <button type="submit">Adicionar</button>
        </form>
        <ul>
            {% for f in funcionarios %}
            <li>
                {{ f }}
                <form method="post" style="display:inline;">
                    <input type="hidden" name="action" value="remover">
                    <input type="hidden" name="nome" value="{{ f }}">
                    <button class="del" type="submit">Remover</button>
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
