<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Importar Banco</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; }
        .header { background: #007bff; color: white; padding: 15px 30px; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; }
        input[type=file] { margin: 15px 0; }
        button { padding: 12px 25px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .flash { padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .success { background: #d4edda; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('admin_usuarios') }}">← Voltar</a>
    </div>
    <div class="container">
        <h2>Importar Banco de Dados</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash success">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <p>Envie o arquivo <b>banco_dados.db</b> do seu computador.</p>
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="banco" accept=".db" required>
            <br>
            <button type="submit">Importar Banco</button>
        </form>
        <p style="color:#666; font-size:13px; margin-top:20px;">
            Atenção: isso vai substituir o banco atual da nuvem.
        </p>
    </div>
</body>
</html>
